spring:
  application:
    name: queue
  data:
    redis:
      # 장애 때 요청이 오래 매달리지 않게 한다(NFR-5 p95 200ms)
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    consumer:
      group-id: queue
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
server:
  port: 8083
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
curtaincall:
  topics:
    session: event.session
    order: reservation.order
  queue:
    zone: Asia/Seoul
    entry-ttl: 10m
    stale-after: 60s
    admit-stale-after: 15s
  jwt:
    # 비밀값이라 기본값을 두지 않는다. 환경변수 CURTAINCALL_JWT_ENTRY_SECRET으로 넣는다(gateway와 같은 값)
