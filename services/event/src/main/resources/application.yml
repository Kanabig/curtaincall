spring:
  datasource:
    hikari:
      data-source-properties:
        # JVM·서버 시간대와 무관하게 Instant를 UTC로 쓰고 읽는다. MySQL 서버도 UTC라 DEFAULT CURRENT_TIMESTAMP 열과 같은 기준이다
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  application:
    name: event
  kafka:
    admin:
      # 이미 만들어진 토픽(event.session)에도 선언한 설정(compaction)을 적용한다
      modify-topic-configs: true
server:
  port: 8082
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
curtaincall:
  kopis:
    # auto: 키가 있으면 live, 없으면 fixture
    mode: auto
    api-key: ${KOPIS_API_KEY:}
    base-url: http://www.kopis.or.kr/openApi/restful
    connect-timeout: 3s
    read-timeout: 10s
    daily-limit: 100
    sync-max-calls: 60
    window-days: 90
    list-rows: 100
    facility-refresh: 30d
    detail-max-attempts: 3
    cron: "0 0 4 * * *"
    zone: Asia/Seoul
  outbox:
    enabled: true
  topics:
    session: event.session
