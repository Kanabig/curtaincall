spring:
  application:
    name: reservation
  kafka:
    consumer:
      auto-offset-reset: earliest
server:
  port: 8084
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
curtaincall:
  outbox:
    enabled: true
    consumer:
      enabled: true
  event:
    base-url: http://localhost:8082
    connect-timeout: 1s
    read-timeout: 10s
  inventory:
    insert-batch-size: 1000
  order:
    scheduler:
      interval: 5s
