spring:
  datasource:
    hikari:
      data-source-properties:
        # JVM·서버 시간대와 무관하게 Instant를 UTC로 쓰고 읽는다. MySQL 서버도 UTC라 DEFAULT CURRENT_TIMESTAMP 열과 같은 기준이다
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  application:
    name: reservation
  kafka:
    consumer:
      auto-offset-reset: earliest
server:
  port: 8084
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,dlt
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
curtaincall:
  outbox:
    enabled: true
    consumer:
      enabled: true
      # event.session은 queue도 읽는다. 이 토픽만 DLT 이름에 서비스를 붙인다
      dlt-topics:
        "[event.session]": event.session.reservation.DLT
  event:
    base-url: http://localhost:8082
    connect-timeout: 1s
    read-timeout: 10s
  inventory:
    insert-batch-size: 1000
  order:
    scheduler:
      interval: 5s
