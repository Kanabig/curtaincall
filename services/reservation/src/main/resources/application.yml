spring:
  application:
    name: reservation
  datasource:
    hikari:
      # 기본 10개에서는 초당 1000건 점유 부하에서 연결 획득 대기가 쌓여 처리량이 700/s에서 멈췄다(p95 3초). 서비스 하나가 쓰는 연결이 늘므로 MySQL max_connections(151)와 서비스별 풀 합계를 함께 본다
      maximum-pool-size: 40
  kafka:
    consumer:
      auto-offset-reset: earliest
server:
  port: 8084
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,dlt
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
curtaincall:
  outbox:
    enabled: true
    consumer:
      enabled: true
  event:
    base-url: http://localhost:8082
    connect-timeout: 1s
    read-timeout: 10s
  inventory:
    insert-batch-size: 1000
  order:
    scheduler:
      interval: 5s
