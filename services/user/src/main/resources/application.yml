spring:
  datasource:
    hikari:
      data-source-properties:
        # JVM·서버 시간대와 무관하게 Instant를 UTC로 쓰고 읽는다. MySQL 서버도 UTC라 DEFAULT CURRENT_TIMESTAMP 열과 같은 기준이다
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  application:
    name: user
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: 8081
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
curtaincall:
  jwt:
    # 비밀값이라 기본값을 두지 않는다. 환경변수 CURTAINCALL_JWT_ACCESS_SECRET으로 넣는다
    access-ttl: 30m
  user:
    refresh-ttl: 14d
    # 이 시간 안의 재사용은 탭 동시 회전으로 보고 계열을 폐기하지 않는다
    refresh-reuse-grace: 10s
    # 둘 다 있을 때만 ADMIN 시드 계정을 만든다(USR-4)
    admin:
      email: ${CURTAINCALL_ADMIN_EMAIL:}
      password: ${CURTAINCALL_ADMIN_PASSWORD:}
