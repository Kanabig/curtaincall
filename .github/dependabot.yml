version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels: [build]
    ignore:
      # Boot·Cloud 메이저/마이너 업그레이드는 별도 마이그레이션 작업으로 진행한다
      - dependency-name: org.springframework.boot*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: org.springframework.cloud*
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Gradle 메이저는 Boot 마이그레이션 때 함께 올린다
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-major]
  - package-ecosystem: gradle
    directory: /build-logic
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels: [build]
    ignore:
      - dependency-name: org.springframework.boot*
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [ci]
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels: [build]
    ignore:
      # 메이저는 typescript-eslint 등 peer 지원을 확인한 뒤 수동으로 올린다
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /frontend/e2e
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels: [build]
    ignore:
      # playwright는 E2E 실행 이미지(frontend/e2e/run.sh의 이미지 태그)와 버전이 같아야 한다.
      # 패키지만 올리면 브라우저를 찾지 못해 실행이 실패하므로 이미지와 함께 수동으로 올린다.
      - dependency-name: playwright
      - dependency-name: "@playwright/test"
      - dependency-name: "*"
        update-types: [version-update:semver-major]
