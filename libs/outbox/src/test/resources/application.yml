spring:
  kafka:
    consumer:
      auto-offset-reset: earliest
management:
  endpoints:
    web:
      exposure:
        include: prometheus,dlt
curtaincall:
  outbox:
    enabled: true
    relay:
      # 테스트에서 릴레이를 직접 돌린다. 캐시된 컨텍스트의 릴레이가 다른 테스트의 행을 가져가지 않게 한다
      auto-start: false
    consumer:
      enabled: true
      backoff-initial: 50ms
      # 토픽별 DLT 이름 지정. 지정하지 않은 토픽은 {토픽}.DLT
      dlt-topics:
        "[test.bad]": test.bad.svc.DLT
