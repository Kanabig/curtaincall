global:
  scrape_interval: 5s

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8089
          - user:8081
          - event:8082
          - queue:8083
          - reservation:8084
          - payment:8085
          - notification:8086
          - search-assist:8087
          - mock-pg:8090
