plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'com.diffplug.spotless'
    id 'io.spring.dependency-management'
}

group = 'io.github.kanabig'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.2'
    }
    dependencies {
        // kafka-clients가 끌어오는 압축 라이브러리의 취약 버전을 수정판으로 올린다
        dependency 'at.yawk.lz4:lz4-java:1.11.4'
        dependency 'org.xerial.snappy:snappy-java:1.1.10.9'
    }
}

dependencies {
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    // 측정용 테스트(@Tag("perf"))는 기본 빌드에서 빠지고 -Pperf를 줄 때만 돈다
    useJUnitPlatform {
        if (project.hasProperty('perf')) {
            includeTags 'perf'
        } else {
            excludeTags 'perf'
        }
    }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.103.0')
        removeUnusedImports()
        forbidWildcardImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '14.4.0'
    configDirectory = rootProject.file('config/checkstyle')
    maxWarnings = 0
}
