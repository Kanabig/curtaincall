# 측정용 덮어쓰기. 한 대에서 부하를 걸므로 IP 한도만 사실상 끈다(계정 한도는 기본값 그대로).
# 사용: docker compose -p <프로젝트> -f compose.yml -f perf/open-sale/compose.perf.yml ...
services:
  gateway:
    environment:
      RATE_LIMIT_IP_PER_SECOND: ${RATE_LIMIT_IP_PER_SECOND:-1000000}
      RATE_LIMIT_IP_BURST: ${RATE_LIMIT_IP_BURST:-1000000}
      RATE_LIMIT_IP_POLL_PER_SECOND: ${RATE_LIMIT_IP_POLL_PER_SECOND:-1000000}
      RATE_LIMIT_IP_POLL_BURST: ${RATE_LIMIT_IP_POLL_BURST:-1000000}
      RATE_LIMIT_USER_PER_SECOND: ${RATE_LIMIT_USER_PER_SECOND:-10}
      RATE_LIMIT_USER_BURST: ${RATE_LIMIT_USER_BURST:-20}
  queue:
    environment:
      SPRING_DATA_REDIS_TIMEOUT: ${QUEUE_REDIS_TIMEOUT:-500ms}
